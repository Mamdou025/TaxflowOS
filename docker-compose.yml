# Development only. See docs/DEVELOPMENT.md for first-run setup and verification.
# The dependencies, API and web containers share the exact same Node/pnpm image.
x-node: &node
  image: taxflowos-dev:node24.21.0-pnpm10.33.2
  build:
    context: .
    dockerfile: docker/development.Dockerfile
  working_dir: /app
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - ai_workflow_builder_node_modules:/app/artifacts/ai-workflow-builder/node_modules
    - api_server_node_modules:/app/artifacts/api-server/node_modules
    - inscope_pitch_node_modules:/app/artifacts/inscope-pitch/node_modules
    - mockup_sandbox_node_modules:/app/artifacts/mockup-sandbox/node_modules
    - agent_runtime_node_modules:/app/lib/agent-runtime/node_modules
    - api_client_react_node_modules:/app/lib/api-client-react/node_modules
    - api_spec_node_modules:/app/lib/api-spec/node_modules
    - api_zod_node_modules:/app/lib/api-zod/node_modules
    - db_node_modules:/app/lib/db/node_modules
    - source_connectors_node_modules:/app/lib/source-connectors/node_modules
    - source_core_node_modules:/app/lib/source-core/node_modules
    - workflow_contracts_node_modules:/app/lib/workflow-contracts/node_modules
    - workflow_core_node_modules:/app/lib/workflow-core/node_modules
    - workflow_executors_node_modules:/app/lib/workflow-executors/node_modules
    - scripts_node_modules:/app/scripts/node_modules
    - pnpm_store:/pnpm/store

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taxflowos
    ports:
      - '${TAXFLOW_DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d taxflowos']
      interval: 5s
      timeout: 5s
      retries: 10

  deps:
    <<: *node
    command: pnpm install --frozen-lockfile --store-dir /pnpm/store

  migrate:
    <<: *node
    command: pnpm --filter @workspace/db run migrate
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/taxflowos
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully

  api:
    <<: *node
    command: pnpm --filter @workspace/api-server run dev
    environment:
      NODE_ENV: development
      PORT: '5000'
      DATABASE_URL: postgres://postgres:postgres@db:5432/taxflowos
    env_file:
      - path: .env.local
        required: false
    ports:
      - '${TAXFLOW_API_PORT:-5050}:5000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *node
    command: pnpm --filter @workspace/ai-workflow-builder run dev
    environment:
      NODE_ENV: development
      PORT: '5173'
      BASE_PATH: /
      API_BASE: http://api:5000
      VITE_USE_POLLING: '1'
    env_file:
      - path: .env.local
        required: false
    ports:
      - '${TAXFLOW_WEB_PORT:-5173}:5173'
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
  ai_workflow_builder_node_modules:
  api_server_node_modules:
  inscope_pitch_node_modules:
  mockup_sandbox_node_modules:
  agent_runtime_node_modules:
  api_client_react_node_modules:
  api_spec_node_modules:
  api_zod_node_modules:
  db_node_modules:
  source_connectors_node_modules:
  source_core_node_modules:
  workflow_contracts_node_modules:
  workflow_core_node_modules:
  workflow_executors_node_modules:
  scripts_node_modules:
  pnpm_store:
