name: Verify
on:
  pull_request:
  push:
    branches: [main, DevBranch, DevReplit]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run release:check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failures
          path: test-results/
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run release:check:persistence
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: persistence-failures
          path: test-results/phase2/
